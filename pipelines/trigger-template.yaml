apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: github-pr-template
  namespace: openshift-pipelines
spec:
  params:
  - name: repo-url
  - name: revision
  - name: sha
  resourcetemplates:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: validate-pr-
      namespace: openshift-pipelines
    spec:
      pipelineRef:
        name: validate-gitops-pr
      podTemplate:
        dnsConfig:
          options:
          - name: ndots
            value: "2"
          - name: single-request-reopen
          - name: timeout
            value: "1"
          - name: attempts
            value: "1"
      params:
      - name: repo-url
        value: $(tt.params.repo-url)
      - name: revision
        value: $(tt.params.revision)
      - name: sha
        value: $(tt.params.sha)
      workspaces:
      - name: source
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
