apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: github-set-status
  namespace: openshift-pipelines
spec:
  params:
  - name: repo-full-name
    type: string
    default: fontained/ocp-lab-gitops
  - name: sha
    type: string
  - name: state
    type: string
    default: success
  - name: description
    type: string
    default: Pipeline completed
  steps:
  - name: set-status
    image: curlimages/curl:latest
    script: |
      #!/bin/sh
      # Convertir Succeeded/Failed → success/failure
      TEKTON_STATE="$(params.state)"
      if [ "${TEKTON_STATE}" = "Succeeded" ]; then
        GH_STATE="success"
      else
        GH_STATE="failure"
      fi
      echo "Tekton state: ${TEKTON_STATE} → GitHub state: ${GH_STATE}"
      echo "SHA: $(params.sha)"
      RESULT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
        -X POST \
        -H "Authorization: token ${GITHUB_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"state\": \"${GH_STATE}\",
          \"description\": \"IEC 62443 validation: ${GH_STATE}\",
          \"context\": \"validate-gitops-pr\",
          \"target_url\": \"https://github.com/$(params.repo-full-name)/actions\"
        }" \
        "https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.sha)")
      echo "${RESULT}"
      HTTP_CODE=$(echo "${RESULT}" | grep "HTTP_STATUS" | cut -d: -f2)
      [ "${HTTP_CODE}" = "201" ] && echo "Status posted successfully" || exit 1
    env:
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: github-token
          key: password
