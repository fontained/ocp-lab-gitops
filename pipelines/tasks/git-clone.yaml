apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: openshift-pipelines
spec:
  params:
  - name: url
    type: string
  - name: revision
    type: string
    default: main
  workspaces:
  - name: output
  steps:
  - name: clone
    image: alpine/git:latest
    script: |
      git clone --depth=1 --branch=$(params.revision) \
        $(params.url) $(workspaces.output.path) || \
      git clone --depth=1 $(params.url) $(workspaces.output.path) && \
      cd $(workspaces.output.path) && \
      git checkout $(params.revision)
