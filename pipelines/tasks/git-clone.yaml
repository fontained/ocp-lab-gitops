apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: openshift-pipelines
spec:
  params:
  - name: url
    type: string
  - name: revision
    type: string
    default: main
  workspaces:
  - name: output
  steps:
  - name: clone
    image: bitnami/git:latest
    script: |
      #!/bin/bash
      set -eu
      cd $(workspaces.output.path)
      git clone --depth=1 $(params.url) .
      git checkout $(params.revision) 2>/dev/null || true
      echo "Cloned successfully"
      git log --oneline -1
