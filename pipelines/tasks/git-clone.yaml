apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: openshift-pipelines
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: bitnami/git:latest
      env:
        - name: HOME
          value: /workspace
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: password
        - name: GITHUB_USER
          valueFrom:
            secretKeyRef:
              name: github-token
              key: username
      script: |
        #!/bin/bash
        set -eu
        git config --global --add safe.directory /workspace/output
        REPO_URL=$(params.url)
        REVISION=$(params.revision)
        AUTH_URL=$(echo ${REPO_URL} | sed "s|https://|https://${GITHUB_USER}:${GITHUB_TOKEN}@|")
        cd $(workspaces.output.path)
        git init -q .
        git remote add origin ${AUTH_URL}
        git fetch --depth=1 origin ${REVISION}
        git checkout -q FETCH_HEAD
        echo "=== Clone successful ==="
        echo "Requested revision: ${REVISION}"
        git log --oneline -1
