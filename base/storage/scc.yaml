apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: local-path-provisioner-scc
  annotations:
    iec62443.rationale: "hostPath + allowHostDirVolumePlugin required to provision PV on node-local NVMe; runAsUser RunAsAny required to chown volume directories. Privilege scoped to the single provisioner ServiceAccount via the users list; privileged, hostNetwork, hostPID and hostPorts all denied."
    iec62443.residual-risk: "Pod with this SCC can read/write any host path on its node; mitigated by ServiceAccount scoping and OPA policy enforced at PR time"
    iec62443.sr: "SR 7.7 Least Functionality"
    iec62443.hardening: "All defaulted fields declared explicitly; privilege escalation denied and all capabilities dropped"
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: true
allowHostNetwork: false
allowHostIPC: false
allowHostPID: false
allowHostPorts: false
allowedCapabilities: null
defaultAddCapabilities: null
requiredDropCapabilities:
- ALL
priority: null
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
- hostPath
- configMap
- emptyDir
- secret
- persistentVolumeClaim
users:
- system:serviceaccount:local-path-storage:local-path-provisioner-service-account
groups: []
