apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iec62443-zones
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/fontained/ocp-lab-gitops.git
    targetRevision: main
    path: overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
